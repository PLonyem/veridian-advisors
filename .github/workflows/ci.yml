name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veridian-backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veridian_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veridian_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veridian_test
      RUN_DB_TESTS: "true"
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      DATA_ENCRYPTION_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      RATE_LIMIT_HMAC_KEY: ci-only-rate-limit-secret-at-least-32-characters
      TRUSTED_ORIGINS: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: veridian-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:validate
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
